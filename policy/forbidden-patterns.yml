forbidden_patterns:
  - name: private_local_path
    pattern: '(/Users/[^\s]+|/home/[^\s]+|C:\\Users\\[^\s]+|(^|\s)~[/\\][^\s]+)'
    severity: error
    remediation: "remove local absolute paths before committing"

  - name: raw_requirements_prompt
    pattern: '((^|[/\\])(raw-inputs|prompt-sources?|requirements-prompts?|spec-kit-prompts?)([/\\]|$)|[A-Za-z0-9_.-]*(requirements|prompts?)[A-Za-z0-9_.-]*\.(md|txt))'
    severity: error
    remediation: "move raw requirements or prompts to the private planning repo"

  - name: raw_research_summary
    pattern: '((^|[/\\])(raw-research|research-notes|audit-summary|server-reports?)([/\\]|$)|[A-Za-z0-9_.-]*(final[-_]?summary|audit[-_]?summary)[A-Za-z0-9_.-]*\.(md|txt|json))'
    severity: error
    remediation: "move raw research output to private storage"

  - name: private_advisory_language
    pattern: '(founder[-_ ]?coaching|internal[-_ ]?advice|customer[-_ ]?outreach|private[-_ ]?brief|operator[-_ ]?notes)'
    severity: error
    remediation: "remove private advisory language from public artifacts"

  - name: commercial_strategy
    pattern: '(go[-_ ]?to[-_ ]?market|commercial[-_ ]?strategy|revenue[-_ ]?model|monetization[-_ ]?plan|investor[-_ ]?brief|sales[-_ ]?target)'
    severity: error
    remediation: "move commercial strategy content out of the public repo"

  - name: private_workspace_shape
    pattern: '((^|[/\\])(\.private|_private|raw-inputs|public-candidate|export-log|scrub-report|runs)([/\\]|$)|(^|[/\\])([A-Za-z0-9_-]+-private|private-[A-Za-z0-9_-]+)([/\\]|$))'
    severity: error
    remediation: "move private workspace or staging artifacts out of the public repo"

  - name: undisclosed_file_line_evidence
    pattern: '((github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+).{0,120}(line|lines|:[0-9]{2,})|[A-Za-z0-9_./-]+\.(ts|tsx|js|jsx|py|go|rs):[0-9]{2,})'
    severity: error
    remediation: "remove exact third-party file and location evidence"
